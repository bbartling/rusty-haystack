<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title description">
  <title id="title">One admitted contract, shared application authority</title>
  <desc id="description">The admitted Xeto catalog supplies signatures and contexts to a scoped application with a fixed executable registry. Rust and typed HTTP adapters and schema export use that application's policy, budgets, session and lifecycle. Optional service owners are selected explicitly. A generated client consumes the schema and calls the HTTP adapter.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#46647c" stroke-width="1.4"/></marker></defs>
  <rect width="1080" height="460" rx="18" fill="#f5f8fb"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#173249">
    <text x="38" y="42" font-size="23" font-weight="650">One admitted contract, shared application authority</text>
    <g fill="#fff" stroke="#aac0d0" stroke-width="1.5">
      <rect x="38" y="92" width="284" height="130" rx="12"/>
      <rect x="398" y="82" width="292" height="150" rx="12" fill="#e8f3f1" stroke="#4a8a82"/>
      <rect x="766" y="92" width="276" height="130" rx="12"/>
      <rect x="38" y="310" width="284" height="104" rx="12"/>
      <rect x="398" y="310" width="292" height="104" rx="12"/>
      <rect x="766" y="310" width="276" height="104" rx="12"/>
    </g>
    <g font-size="19" font-weight="650">
      <text x="60" y="124">Admitted Xeto catalog</text><text x="420" y="117">Scoped application</text><text x="788" y="124">Rust + typed HTTP</text>
      <text x="60" y="343">Optional service owners</text><text x="420" y="343">Scoped schema export</text><text x="788" y="343">Generated client</text>
    </g>
    <g font-size="16">
      <text x="60" y="156">Pinned subset + project Dicts</text><text x="60" y="183">Immutable activated observation</text>
      <text x="420" y="146">Fixed executable registry</text><text x="420" y="173">Policy · budgets · session</text><text x="420" y="200">Cancellation · lifecycle owner</text>
      <text x="788" y="156">Shared admission and dispatch</text><text x="788" y="183">Exact encoding or explicit error</text>
      <text x="60" y="370">History · watches · commands</text><text x="60" y="395">Selected by the application</text>
      <text x="420" y="370">OpenAPI 3.1 + JSON Schema</text><text x="420" y="395">Visible supported shape + limits</text>
      <text x="788" y="370">Uses the exported contract</text><text x="788" y="395">Calls real HTTP operations</text>
    </g>
    <g fill="none" stroke="#46647c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M322 157H384"/><path d="M690 157H752"/><path d="M544 232V297"/>
      <path d="M322 361H356V211H385"/><path d="M690 361H752"/><path d="M904 310V237"/>
    </g>
    <g font-size="14" fill="#46647c"><text x="555" y="272">same authority</text><text x="916" y="271">HTTP</text></g>
  </g>
</svg>
