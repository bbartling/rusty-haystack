[package]
name = "rusty-haystack-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded read-only Haystack tools over MCP stdio and Streamable HTTP"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "haystack_mcp"

[features]
default = []
adapter = ["dep:haystack-app", "dep:haystack-core", "dep:rmcp", "dep:serde", "dep:serde_json", "dep:tokio", "dep:parking_lot", "dep:thiserror"]

stdio = ["adapter"]
http = ["adapter", "rmcp/transport-streamable-http-server", "dep:base64", "dep:ring", "dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tower", "dep:url", "dep:socket2"]

[dependencies]
haystack-app = { workspace = true, optional = true }
haystack-core = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time", "macros"], optional = true }
parking_lot = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

base64 = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, features = ["server", "http1"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
tower = { workspace = true, optional = true }
url = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }

[dev-dependencies]
chrono.workspace = true
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
reqwest = { workspace = true, features = ["json", "stream"] }
