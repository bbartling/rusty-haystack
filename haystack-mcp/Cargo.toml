[package]
name = "rusty-haystack-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded read-only Haystack tools over MCP stdio"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "haystack_mcp"

[features]
default = []
stdio = ["dep:haystack-app", "dep:haystack-core", "dep:rmcp", "dep:serde", "dep:serde_json", "dep:tokio", "dep:parking_lot", "dep:thiserror"]

[dependencies]
haystack-app = { workspace = true, optional = true }
haystack-core = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["server"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time", "macros"], optional = true }
parking_lot = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "server", "transport-async-rw"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }
